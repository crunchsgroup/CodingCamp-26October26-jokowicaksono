<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Expense & Budget Visualizer</h1>
      <button id="themeToggle" class="btn-secondary">🌙 Dark Mode</button>
    </header>

    <!-- Total Balance Card -->
    <section class="card balance-card">
      <h2>TOTAL BALANCE</h2>
      <div id="totalBalance" class="balance-amount">$0.00</div>
      
      <!-- Challenge: Limit Spending -->
      <div class="limit-container">
        <label for="budgetLimit">Set Spending Limit ($):</label>
        <input type="number" id="budgetLimit" placeholder="e.g. 500" step="0.01">
      </div>
      <p id="limitWarning" class="warning-text hidden">⚠️ Spending limit exceeded!</p>
    </section>

    <div class="grid-layout">
      <!-- Input Form -->
      <section class="card">
        <h3>Add Transaction</h3>
        <form id="transactionForm">
          <div class="form-group">
            <label for="itemName">Item Name</label>
            <input type="text" id="itemName" placeholder="e.g. Cilok" required>
          </div>
          <div class="form-group">
            <label for="amount">Amount ($)</label>
            <input type="number" id="amount" step="0.01" placeholder="e.g. 14.94" required>
          </div>
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
          </div>
          <button type="submit" class="btn-primary">Add Transaction</button>
        </form>
      </section>

      <!-- Chart Section -->
      <section class="card">
        <h3>Spending by Category</h3>
        <div class="chart-container">
          <canvas id="expenseChart"></canvas>
        </div>
      </section>
    </div>

    <!-- Transaction List Section -->
    <section class="card">
      <div class="list-header">
        <h3>Transactions</h3>
        <!-- Challenge: Sort -->
        <div class="sort-container">
          <label for="sortBy">Sort by:</label>
          <select id="sortBy">
            <option value="newest">Newest</option>
            <option value="amount-high">Amount (High to Low)</option>
            <option value="amount-low">Amount (Low to High)</option>
            <option value="category">Category</option>
          </select>
        </div>
      </div>
      
      <div class="transaction-list-wrapper">
        <ul id="transactionList" class="transaction-list"></ul>
      </div>
    </section>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
